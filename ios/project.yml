name: ReachSenseAI
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    iOS: '17.0'
packages:
  ReachSenseCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  ReachSenseAI:
    type: application
    platform: iOS
    sources: [App, Camera]
    dependencies:
      - package: ReachSenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.reachsenseai.instrument
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 'ReachSenseAI uses the front TrueDepth camera to record synchronized RGB and depth for instrument feasibility testing.'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    scheme:
      gatherCoverageData: true
