name: Native software verification
on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install marker experiment dependency
        run: python -m pip install -r scripts/feasibility/requirements.txt
      - name: Research export behavior
        run: python -m unittest discover -s python_tests -v
  core-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Core behavioral tests
        run: swift test
  ios-build:
    needs: core-tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Compile device target
        working-directory: ios
        run: xcodebuild -project ReachSenseAI.xcodeproj -scheme ReachSenseAI -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Compile simulator target
        working-directory: ios
        run: xcodebuild -project ReachSenseAI.xcodeproj -scheme ReachSenseAI -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
